name: CLOC Code Statistics

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  actions: read

jobs:
  cloc:
    name: Count Lines of Code
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Install cloc
        run: |
          sudo apt-get update
          sudo apt-get install -y cloc

      - name: Run cloc and generate reports
        run: |
          # Print current directory and environment information
          echo "Current directory: $(pwd)"
          echo "Environment: $(uname -a)"
          
          # Run cloc commands to generate CSV reports
          echo "Generating CSV report..."
          cloc --csv --out=./cloc-report.csv --exclude-dir=.git,node_modules,__pycache__,.pytest_cache,dist,build .
          
          # Run cloc commands to generate JSON reports
          echo "Generating JSON report..."
          cloc --json --out=./cloc-report.json --exclude-dir=.git,node_modules,__pycache__,.pytest_cache,dist,build .
          
          # Run cloc commands to generate Markdown reports
          echo "Generating Markdown report..."
          cloc --md --out=./cloc-report.md --exclude-dir=.git,node_modules,__pycache__,.pytest_cache,dist,build .
          
          # Verify file generation
          echo "Generated files:"
          ls -la ./cloc-*

      - name: Upload cloc reports as artifacts
        uses: actions/upload-artifact@v7
        with:
          name: cloc-reports
          path: |
            ./cloc-report.csv
            ./cloc-report.json
            ./cloc-report.md

      - name: Generate summary table for PR comment
        if: github.event_name == 'pull_request'
        id: summary
        run: |
          # Print debug information
          echo "===== PR comment generation debug information ===="
          echo "Current directory: $(pwd)"
          echo "Files list:"
          ls -la ./cloc-* 2>/dev/null || echo "No cloc report files found"
          
          python3 <<'EOF'
          import os
          import sys
          import re

          print("Generating PR comment summary...")

          # First check CSV file, as the most reliable source source
          csv_file = './cloc-report.csv'
          table_content = ""
          
          if os.path.exists(csv_file):
              print(f"Reading data from {csv_file} to generate table")
              try:
                  # Simplified CSV read method
                  with open(csv_file, 'r', encoding='utf-8') as f:
                      lines = f.readlines()
                      
                  if len(lines) > 1:
                      # Extract headers and data lines
                      headers = lines[0].strip().split(',')
                      data_lines = lines[1:]
                      
                      # Ensure correct column headers
                      if len(headers) >= 6:
                          # Create table header
                          table_content = "| Language | Files | Blank | Comment | Code | Ratio |\n"
                          table_content += "|------|--------|--------|----------|----------|------|\n"
                          
                          # Parse data and calculate total
                          rows = []
                          total_code = 0
                          
                          for line in data_lines:
                              try:
                                  # CSV parse
                                  parts = re.split(r',(?=(?:[^"]*"[^"]*")*[^"]*$)', line.strip())
                                  if len(parts) >= 5:
                                      # Files, blank, comment, code
                                      files = int(parts[0]) if parts[0].isdigit() else 0
                                      lang = parts[1].strip('"') if parts[1].startswith('"') else parts[1]
                                      # Skip SUM line
                                      if lang == 'SUM':
                                          continue
                                      blank = int(parts[2]) if parts[2].isdigit() else 0
                                      comment = int(parts[3]) if parts[3].isdigit() else 0
                                      code = int(parts[4]) if parts[4].isdigit() else 0
                                      rows.append((lang, files, blank, comment, code))
                                      total_code += code
                              except Exception as e:
                                  print(f"Error parsing line in CSV file: {line}, Error: {e}")
                          
                          # Sort by code lines
                          rows.sort(key=lambda x: x[4], reverse=True)
                          
                          # Format numbers
                          def format_num(n):
                              return f"{n:,}"
                          
                          # Generate table rows
                          for row in rows:
                              lang, files, blank, comment, code = row
                              percent = (code / total_code * 100) if total_code > 0 else 0
                              table_content += f"| {lang} | {format_num(files)} | {format_num(blank)} | {format_num(comment)} | {format_num(code)} | {percent:.1f}% |\n"
                          
                          # Calculate totals
                          total_files = sum(row[1] for row in rows)
                          total_blank = sum(row[2] for row in rows)
                          total_comment = sum(row[3] for row in rows)
                          
                          # Add total row
                          table_content += "| **总计** | **" + format_num(total_files) + "** | **" + format_num(total_blank) + "** | **" + format_num(total_comment) + "** | **" + format_num(total_code) + "** | **100.0%** |\n"
              except Exception as e:
                  print(f"Error reading CSV file data: {e}")
          
          # If CSV file read failed or no table generated, try from Markdown file
          md_file = './cloc-report.md'
          if not table_content and os.path.exists(md_file):
              print(f"Reading data from {md_file} to generate table")
              try:
                  with open(md_file, 'r', encoding='utf-8') as f:
                      md_content = f.read()
                  
                  # Directly find table part in Markdown content
                  if "| Language |" in md_content:
                      lines = md_content.split('\n')
                      table_start = False
                      table_lines = []
                      
                      for line in lines:
                          if "| Language |" in line:
                              table_start = True
                              # Add table header
                              table_lines.append("| Language | Files | Blank | Comment | Code | Ratio |\n")
                              table_lines.append("|------|--------|--------|----------|----------|------|\n")
                          elif table_start and "|" in line:
                              # Skip separator line
                              if "---" in line:
                                  continue
                              # Add data row
                              table_lines.append(line + "\n")
                          elif table_start and not line.strip():
                              break
                      
                      if len(table_lines) > 2:
                          table_content = ''.join(table_lines)
              except Exception as e:
                  print(f"Error reading Markdown file data: {e}")
          
          if not table_content:
              print("Using fallback table template")
              table_content = "| Language | Files | Blank | Comment | Code | Ratio |\n"
              table_content += "|------|--------|--------|----------|----------|------|\n"
              table_content += "| **Generating report** | - | - | - | - |\n"
              table_content += "| **Details** | - | - | - | - |\n"
          
          # Write table content to environment variable
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f"table<<EOF\n{table_content}\nEOF\n")
          
          print("PR comment table generated successfully")
          # Print table content for debugging
          print("\nTable content preview:")
          print(table_content[:500] + "..." if len(table_content) > 500 else table_content)
          EOF

      - name: Comment PR with cloc summary
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v9
        with:
          script: |
            const table = `${{ steps.summary.outputs.table }}`;
            const body = `## 📊 Lines of Code Report (cloc)\n\n${table}\n\n<details><summary>Full reports</summary>\n\nDownload artifacts from the [workflow run](../actions/runs/${{ github.run_id }}).\n\n</details>`;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body
            });

      - name: Generate job summary
        run: |
          # Print debugging information
          echo "===== Job summary generation debugging information ===="
          echo "Current directory: $(pwd)"
          echo "File list:"
          ls -la ./cloc-* 2>/dev/null || echo "No cloc report file found."
          
          python3 <<'EOF'
          import os
          import re
          
          print("Generating GitHub Job Summary...")
          
          # Create summary file path
          summary_path = os.environ.get('GITHUB_STEP_SUMMARY', '')
          if not summary_path:
              print("Warning: GITHUB_STEP_SUMMARY environment variable not set. Using './job-summary.md' as fallback")
              # Create a temporary file as fallback
              summary_path = './job-summary.md'
          
          # Generate summary content
          summary_content = "# Code Statistics Report\n\n"
          
          # First check CSV file, as the most reliable data source
          csv_file = './cloc-report.csv'
          table_content = ""
          
          if os.path.exists(csv_file):
              print(f"Reading data from {csv_file} to generate table")
              try:
                  # CSV reading method
                  with open(csv_file, 'r', encoding='utf-8') as f:
                      lines = f.readlines()
                      
                  if len(lines) > 1:
                      # Extract headers and data lines
                      headers = lines[0].strip().split(',')
                      data_lines = lines[1:]
                      
                      # Ensure correct columns
                      if len(headers) >= 6:
                          # Create table header
                          table_content = "## Code Statistics Summary\n\n"
                          table_content += "| Language | Files | Blank | Comment | Code | Ratio |\n"
                          table_content += "|------|--------|--------|----------|----------|------|\n"
                          
                          # Parse data and calculate total
                          rows = []
                          total_code = 0
                          
                          for line in data_lines:
                              try:
                                  # CSV parsing
                                  parts = re.split(r',(?=(?:[^"]*"[^"]*")*[^"]*$)', line.strip())
                                  if len(parts) >= 5:
                                      # Files, language, blank, comment, code
                                      files = int(parts[0]) if parts[0].isdigit() else 0
                                      lang = parts[1].strip('"') if parts[1].startswith('"') else parts[1]
                                      # Skip SUM row
                                      if lang == 'SUM':
                                          continue
                                      blank = int(parts[2]) if parts[2].isdigit() else 0
                                      comment = int(parts[3]) if parts[3].isdigit() else 0
                                      code = int(parts[4]) if parts[4].isdigit() else 0
                                      rows.append((lang, files, blank, comment, code))
                                      total_code += code
                              except Exception as e:
                                  print(f"Error parsing line: {line}, Error: {e}")
                          
                          # Sort by code lines count
                          rows.sort(key=lambda x: x[4], reverse=True)
                          
                          # Format numbers
                          def format_num(n):
                              return f"{n:,}"
                          
                          # Generate table rows
                          for row in rows:
                              lang, files, blank, comment, code = row
                              percent = (code / total_code * 100) if total_code > 0 else 0
                              table_content += f"| {lang} | {format_num(files)} | {format_num(blank)} | {format_num(comment)} | {format_num(code)} | {percent:.1f}% |\n"
                          
                          # Calculate totals
                          total_files = sum(row[1] for row in rows)
                          total_blank = sum(row[2] for row in rows)
                          total_comment = sum(row[3] for row in rows)
                          
                          # Add total row
                          table_content += "| **总计** | **" + format_num(total_files) + "** | **" + format_num(total_blank) + "** | **" + format_num(total_comment) + "** | **" + format_num(total_code) + "** | **100.0%** |\n"
              except Exception as e:
                  print(f"Error reading CSV file {csv_file}, Error: {e}")
          
          # If CSV file reading failed or no table generated, try to read from Markdown file
          md_file = './cloc-report.md'
          if not table_content and os.path.exists(md_file):
              print(f"Reading data from {md_file} to generate table")
              try:
                  with open(md_file, 'r', encoding='utf-8') as f:
                      md_content = f.read()
                  
                  # Directly find table part and copy it
                  if "| Language |" in md_content:
                      lines = md_content.split('\n')
                      table_start = False
                      table_lines = []
                      
                      # Add table header
                      table_lines.append("## Code Statistics Summary\n\n")
                      table_lines.append("| Language | Files | Blank | Comment | Code | Ratio |\n")
                      table_lines.append("|------|--------|--------|----------|----------|------|\n")
                      
                      for line in lines:
                          if "| Language |" in line:
                              table_start = True
                          elif table_start and "|" in line:
                              # Skip separator line
                              if "---" in line:
                                  continue
                              # Add data row
                              table_lines.append(line + "\n")
                          elif table_start and not line.strip():
                              break
                      
                      if len(table_lines) > 3:  # Ensure table header and at least one data row
                          table_content = ''.join(table_lines)
              except Exception as e:
                  print(f"Error reading Markdown file {md_file}, Error: {e}")
          
          # Use a default table template if no table content is found
          if not table_content:
              print("Using default table template")
              table_content = "## Code Statistics Summary\n\n"
              table_content += "| Language | Files | Blank | Comment | Code | Ratio |\n"
              table_content += "|------|--------|--------|----------|----------|------|\n"
              table_content += "| Report Generated On | - | - | - | - |\n"
              table_content += "| Details available in the build artifacts | - | - | - | - |\n"
          
          # Add project statistics
          project_info = "## Project Statistics\n\n"
          project_info += "- **Repository**: " + os.environ.get('GITHUB_REPOSITORY', 'Unknown') + "\n"
          project_info += "- **Branch**: " + os.environ.get('GITHUB_REF_NAME', 'Unknown') + "\n"
          project_info += "- **Commit**: " + os.environ.get('GITHUB_SHA', 'Unknown')[:7] + "\n\n"
          
          # Add complete report reference
          complete_report = "## Complete Report\n\n"
          complete_report += "The complete code statistics report is available in the build artifacts.\n"
          complete_report += "- cloc-report.md (Markdown format)\n"
          complete_report += "- cloc-report.csv (CSV format)\n"
          complete_report += "- cloc-report.json (JSON format)\n\n"
          
          # Combine all content
          summary_content += table_content + "\n\n" + project_info + complete_report
          
          # Write summary file
          try:
              with open(summary_path, 'w', encoding='utf-8') as f:
                  f.write(summary_content)
              print(f"Successfully wrote summary to {summary_path}")
          except Exception as e:
              print(f"Error writing summary file: {e}")
              # As fallback, print to console
              print("\nSummary content:")
              print(summary_content)
          
          # Preview summary content for debugging
          print("\nSummary preview preview:")
          print(summary_content[:1000] + "..." if len(summary_content) > 1000 else summary_content)
          EOF
