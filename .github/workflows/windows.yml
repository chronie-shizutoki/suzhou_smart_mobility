name: windows-build
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '/**'
      - '.github/workflows/windows.yml'
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v3
      - name: Setup Visual Studio shell
        uses: ilammy/msvc-dev-cmd@v1
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
          cache-key: 'flutter-:os:-:channel:-:version:-:hash:'
          cache-path: '${{ runner.tool_cache }}/flutter:os::channel:'
      - name: Flutter version
        run: flutter --version
      - name: Check Windows build environment
        run: |
          echo "Checking Windows build environment..."
          echo "Checking MSBuild..."
          where msbuild 2>null || echo "MSBuild not found in PATH"
          echo "Checking PowerShell version..."
          $PSVersionTable.PSVersion
      - name: Install dependencies
        run: flutter pub get
        working-directory: ./
      - name: Enable Windows desktop support
        run: flutter config --enable-windows-desktop
      - name: Build Windows release
        run: |
          echo "Building Windows release..."
          flutter build windows --release -v
          echo "Build completed, checking output directory..."
          if (Test-Path -Path build/windows/x64/runner/Release/) {
            echo "Output directory exists, listing files:"
            Get-ChildItem -Path build/windows/x64/runner/Release/ | Format-Table -AutoSize
          } else {
            echo "Warning: Output directory does not exist"
          }
        working-directory: ./
      - name: Upload Windows build artifact
        uses: actions/upload-artifact@v7
        with:
          name: windows-release
          path: ./build/windows/x64/runner/Release/
          retention-days: 14